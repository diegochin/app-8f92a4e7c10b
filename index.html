<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>London Tube Photo Map</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #dc2626;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .view {
      display: none;
      width: 100vw;
      height: 100vh;
    }
    .view.active {
      display: flex;
    }

    /* Toolbar */
    .toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 100;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toolbar h1 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-right: 8px;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button.secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: #e2e8f0;
    }

    button.danger {
      background: #ef4444;
      color: white;
    }

    button.danger:hover {
      background: #dc2626;
    }

    /* Map Viewport */
    #map-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #eceff1;
      user-select: none;
    }

    #map-viewport:active {
      cursor: grabbing;
    }

    #map-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #map-img {
      display: block;
      max-width: none;
      pointer-events: none;
    }

    /* Station Pins */
    .station-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 6px;
    }

    .station-pin:active {
      cursor: grabbing;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, background 0.15s;
    }

    .station-pin:hover .pin-dot {
      transform: scale(1.4);
      background: #b91c1c;
    }

    /* Gallery View */
    #gallery-view {
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
      padding: 30px;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }

    .gallery-actions {
      display: flex;
      gap: 10px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .gallery-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      transition: transform 0.2s;
    }

    .gallery-card:hover {
      transform: translateY(-3px);
    }

    .gallery-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      background: #f1f5f9;
    }

    /* Floating delete button - Hover only */
    .delete-photo-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.75);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      transition: opacity 0.2s ease, background 0.2s ease, transform 0.15s ease;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
    }

    .gallery-card:hover .delete-photo-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .delete-photo-btn:hover {
      background: #dc2626;
      transform: scale(1.1);
    }

    /* Lightbox Modal */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .lightbox-img {
      max-width: 85vw;
      max-height: 85vh;
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      object-fit: contain;
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      user-select: none;
      pointer-events: auto;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      line-height: 1;
      padding: 0;
      transition: background 0.2s, transform 0.15s;
      z-index: 1010;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-50%) scale(1.08);
    }

    .prev-btn { left: 24px; }
    .next-btn { right: 24px; }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: transparent;
      color: white;
      font-size: 2.5rem;
      border: none;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1010;
    }

    .lightbox-zoom-toolbar {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 8px;
      z-index: 1010;
    }

    .zoom-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .zoom-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 24px;
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      z-index: 1010;
    }

    .empty-state-box {
      grid-column: 1 / -1;
      background: #ffffff;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- MAP VIEW -->
  <div id="map-view" class="view active">
    <div class="toolbar">
      <h1>Tube Map Tour</h1>
      <button onclick="addNewStation()">+ Add Station</button>
      <button class="secondary" onclick="resetZoom()">Reset View</button>
      <button class="secondary" onclick="exportData()">Export JSON</button>
      
      <!-- Import JSON -->
      <input type="file" id="import-json-input" accept=".json,application/json" style="display: none;" onchange="handleImportData(event)">
      <button class="secondary" onclick="document.getElementById('import-json-input').click()">Import JSON</button>

      <!-- Import Photos Folder -->
      <input type="file" id="import-folder-input" webkitdirectory directory multiple style="display: none;" onchange="handleFolderUpload(event)">
      <button class="secondary" onclick="document.getElementById('import-folder-input').click()">Import Photos</button>
      
      <button class="secondary" onclick="clearAllStations()">Clear All</button>
    </div>

    <div id="map-viewport">
      <div id="map-container">
        <img id="map-img" src="tube-map.jpg" alt="London Tube Map">
        <div id="pins-layer"></div>
      </div>
    </div>
  </div>

  <!-- GALLERY VIEW -->
  <div id="gallery-view" class="view">
    <div class="gallery-header">
      <div>
        <button class="secondary" onclick="showMapView()">← Back to Map</button>
        <h1 id="gallery-title" style="margin-top: 10px; font-size: 1.8rem;">Station Photos</h1>
      </div>
      <div class="gallery-actions">
        <input type="file" id="file-input" multiple accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
        <button onclick="document.getElementById('file-input').click()">+ Select / Add Photos</button>
        <button class="danger" onclick="deleteCurrentPin()">Delete This Marker</button>
      </div>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <!-- FULLSCREEN LIGHTBOX -->
  <div id="lightbox">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <button class="nav-btn prev-btn" onclick="prevPhoto()" aria-label="Previous Photo">&#10094;</button>
    
    <div id="lightbox-stage">
      <img id="lightbox-img" class="lightbox-img" src="" alt="Full view">
    </div>

    <div class="lightbox-zoom-toolbar">
      <button class="zoom-btn" onclick="zoomLightbox(1.25)">Zoom +</button>
      <button class="zoom-btn" onclick="zoomLightbox(0.8)">Zoom -</button>
      <button class="zoom-btn" onclick="resetLightboxZoom()">Reset</button>
    </div>

    <button class="nav-btn next-btn" onclick="nextPhoto()" aria-label="Next Photo">&#10095;</button>
    <div id="lightbox-counter" class="lightbox-counter"></div>
  </div>

  <script>
    // --- IndexedDB Storage Engine (Keyed by stationName) ---
    const DB_NAME = 'TubeMapTourDB';
    const DB_VERSION = 2;
    const STORE_NAME = 'station_photos_v2';

    function getStationKey(name) {
      return (name || '').trim().toLowerCase();
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbSavePhoto(stationName, fileName, blob) {
      const db = await openDB();
      const stationKey = getStationKey(stationName);
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put({ id: `${stationKey}___${fileName}`, stationKey, fileName, blob });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetPhoto(stationName, fileName) {
      const db = await openDB();
      const stationKey = getStationKey(stationName);
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(`${stationKey}___${fileName}`);
        req.onsuccess = () => resolve(req.result ? req.result.blob : null);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbDeletePhoto(stationName, fileName) {
      const db = await openDB();
      const stationKey = getStationKey(stationName);
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(`${stationKey}___${fileName}`);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbDeleteStationPhotos(stationName) {
      const db = await openDB();
      const stationKey = getStationKey(stationName);
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.openCursor();
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            if (cursor.value.stationKey === stationKey) {
              cursor.delete();
            }
            cursor.continue();
          } else {
            resolve();
          }
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function dbClearAllPhotos() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // --- State & App Management ---
    let stations = JSON.parse(localStorage.getItem('tube_stations_v4')) || [];
    let currentStation = null;
    let currentPhotoIdx = 0;
    let currentStationPhotoURLs = [];

    function saveStations() {
      localStorage.setItem('tube_stations_v4', JSON.stringify(stations));
    }

    // Sync photos array across all stations sharing the same name
    function syncPhotosForStationName(name, photosList) {
      const key = getStationKey(name);
      stations.forEach(st => {
        if (getStationKey(st.name) === key) {
          st.photos = [...photosList];
        }
      });
      saveStations();
    }

    // --- Pan & Zoom Engine for Map ---
    const viewport = document.getElementById('map-viewport');
    const container = document.getElementById('map-container');
    const mapImg = document.getElementById('map-img');
    const pinsLayer = document.getElementById('pins-layer');

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startX, startY;

    function updateTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function resetZoom() {
      const vpWidth = viewport.clientWidth;
      const vpHeight = viewport.clientHeight;
      const imgWidth = mapImg.naturalWidth || 4961;
      const imgHeight = mapImg.naturalHeight || 3782;

      scale = Math.min(vpWidth / imgWidth, vpHeight / imgHeight);
      panX = (vpWidth - imgWidth * scale) / 2;
      panY = (vpHeight - imgHeight * scale) / 2;

      updateTransform();
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.15;
      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const prevScale = scale;
      if (e.deltaY < 0) {
        scale = Math.min(scale * zoomFactor, 8);
      } else {
        scale = Math.max(scale / zoomFactor, 0.05);
      }

      panX = mouseX - (mouseX - panX) * (scale / prevScale);
      panY = mouseY - (mouseY - panY) * (scale / prevScale);
      updateTransform();
    }, { passive: false });

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.station-pin') || e.target.closest('.toolbar')) return;
      isPanning = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    // --- Station Pins & Dragging ---
    function renderPins() {
      pinsLayer.innerHTML = '';
      stations.forEach(station => {
        const pin = document.createElement('div');
        pin.className = 'station-pin';
        pin.style.left = `${station.x}%`;
        pin.style.top = `${station.y}%`;
        pin.dataset.id = station.id;
        pin.title = station.name;

        pin.innerHTML = `<div class="pin-dot"></div>`;

        setupPinInteractions(pin, station);
        pinsLayer.appendChild(pin);
      });
    }

    function setupPinInteractions(pinElement, station) {
      let isDragging = false;
      let hasMoved = false;
      let startMouseX, startMouseY;

      pinElement.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        isDragging = true;
        hasMoved = false;
        startMouseX = e.clientX;
        startMouseY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = Math.abs(e.clientX - startMouseX);
        const dy = Math.abs(e.clientY - startMouseY);

        if (dx > 5 || dy > 5) {
          hasMoved = true;
          const imgRect = mapImg.getBoundingClientRect();
          const percentX = ((e.clientX - imgRect.left) / imgRect.width) * 100;
          const percentY = ((e.clientY - imgRect.top) / imgRect.height) * 100;

          station.x = Math.max(0, Math.min(100, percentX));
          station.y = Math.max(0, Math.min(100, percentY));

          pinElement.style.left = `${station.x}%`;
          pinElement.style.top = `${station.y}%`;
        }
      });

      window.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        if (hasMoved) {
          saveStations();
        } else {
          openGallery(station);
        }
      });
    }

    function addNewStation() {
      const rawName = prompt("Enter Station Name (e.g. Hammersmith):");
      if (!rawName || !rawName.trim()) return;

      const name = rawName.trim();
      const existingMatch = stations.find(s => getStationKey(s.name) === getStationKey(name));
      const sharedPhotos = existingMatch ? [...existingMatch.photos] : [];

      const viewportRect = viewport.getBoundingClientRect();
      const imgRect = mapImg.getBoundingClientRect();
      
      const centerX = (viewportRect.width / 2 - imgRect.left) / imgRect.width * 100;
      const centerY = (viewportRect.height / 2 - imgRect.top) / imgRect.height * 100;

      const newStation = {
        id: 'stn_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        name: name,
        x: Math.max(5, Math.min(95, centerX)),
        y: Math.max(5, Math.min(95, centerY)),
        photos: sharedPhotos
      };

      stations.push(newStation);
      saveStations();
      renderPins();
      alert(`"${name}" marker placed! Click it to view photos, or drag the red dot to its spot on the map.`);
    }

    async function clearAllStations() {
      if (confirm("Are you sure you want to remove all stations and their saved photos?")) {
        stations = [];
        localStorage.removeItem('tube_stations_v4');
        await dbClearAllPhotos();
        renderPins();
      }
    }

    function deleteCurrentPin() {
      if (!currentStation) return;
      const sameNameCount = stations.filter(s => getStationKey(s.name) === getStationKey(currentStation.name)).length;
      
      if (sameNameCount > 1) {
        if (confirm(`Delete only this marker for "${currentStation.name}"? Other markers for this station will remain.`)) {
          stations = stations.filter(s => s.id !== currentStation.id);
          saveStations();
          renderPins();
          showMapView();
        }
      } else {
        if (confirm(`Delete "${currentStation.name}" marker and all its photos?`)) {
          dbDeleteStationPhotos(currentStation.name);
          stations = stations.filter(s => s.id !== currentStation.id);
          saveStations();
          renderPins();
          showMapView();
        }
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stations, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "tube_stations.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function handleImportData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedStations = JSON.parse(e.target.result);
          if (Array.isArray(importedStations)) {
            stations = importedStations;
            saveStations();
            renderPins();
            alert("Stations imported successfully!");
          } else {
            alert("Invalid JSON format. Expected an array of stations.");
          }
        } catch (err) {
          alert("Error parsing JSON file: " + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    async function handleFolderUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      let loadedCount = 0;

      for (const file of files) {
        const pathParts = file.webkitRelativePath.split('/');
        if (pathParts.length < 2) continue;

        const folderStationName = pathParts[pathParts.length - 2].trim();
        const folderKey = getStationKey(folderStationName);
        const fileName = file.name;

        const matchingStations = stations.filter(s => getStationKey(s.name) === folderKey);

        if (matchingStations.length > 0) {
          await dbSavePhoto(folderStationName, fileName, file);
          
          matchingStations.forEach(st => {
            if (!st.photos.includes(fileName)) {
              st.photos.push(fileName);
            }
          });
          loadedCount++;
        }
      }

      saveStations();
      alert(`Import complete! Loaded ${loadedCount} photos. Matching stations/markers have been linked.`);
      
      if (currentStation) {
        await renderGalleryCards();
      }
      event.target.value = '';
    }

    // --- Gallery Engine ---
    function showMapView() {
      document.getElementById('gallery-view').classList.remove('active');
      document.getElementById('map-view').classList.add('active');
    }

    async function openGallery(station) {
      currentStation = station;
      document.getElementById('map-view').classList.remove('active');
      document.getElementById('gallery-view').classList.add('active');
      document.getElementById('gallery-title').textContent = station.name;
      await renderGalleryCards();
    }

    async function renderGalleryCards() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';
      currentStationPhotoURLs = [];

      if (!currentStation.photos || currentStation.photos.length === 0) {
        grid.innerHTML = `
          <div class="empty-state-box">
            <h3>No Photos Added Yet</h3>
            <p style="margin-top: 8px;">Click <b>"+ Select / Add Photos"</b> above or use <b>"📁 Import Photos Folder"</b> from the map view.</p>
          </div>
        `;
        return;
      }

      for (let idx = 0; idx < currentStation.photos.length; idx++) {
        const photoFile = currentStation.photos[idx];
        const blob = await dbGetPhoto(currentStation.name, photoFile);
        let src = '';

        if (blob) {
          src = URL.createObjectURL(blob);
        } else {
          src = `photos/${encodeURIComponent(currentStation.name)}/${encodeURIComponent(photoFile)}`;
        }

        currentStationPhotoURLs.push(src);

        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.innerHTML = `
          <button class="delete-photo-btn" onclick="event.stopPropagation(); removeSinglePhoto('${photoFile}')" title="Delete Photo">&times;</button>
          <img src="${src}" alt="${currentStation.name}" onclick="openLightbox(${idx})" onerror="this.onerror=null; this.src='https://placehold.co/600x400/f1f5f9/94a3b8?text=Image+Not+Found'">
        `;
        grid.appendChild(card);
      }
    }

    async function handleFileUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length || !currentStation) return;

      for (const file of files) {
        await dbSavePhoto(currentStation.name, file.name, file);
        if (!currentStation.photos.includes(file.name)) {
          currentStation.photos.push(file.name);
        }
      }

      syncPhotosForStationName(currentStation.name, currentStation.photos);
      await renderGalleryCards();
      event.target.value = '';
    }

    async function removeSinglePhoto(fileName) {
      if (!currentStation) return;
      await dbDeletePhoto(currentStation.name, fileName);
      currentStation.photos = currentStation.photos.filter(f => f !== fileName);
      syncPhotosForStationName(currentStation.name, currentStation.photos);
      await renderGalleryCards();
    }

    // --- Fullscreen Lightbox & Photo Zoom Engine ---
    const lightbox = document.getElementById('lightbox');
    const lightboxStage = document.getElementById('lightbox-stage');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCounter = document.getElementById('lightbox-counter');

    let lbScale = 1;
    let lbPanX = 0;
    let lbPanY = 0;
    let lbIsDragging = false;
    let lbStartX, lbStartY;

    function updateLightboxTransform() {
      lightboxImg.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbScale})`;
      lightboxStage.style.cursor = lbScale > 1 ? (lbIsDragging ? 'grabbing' : 'grab') : 'default';
    }

    function resetLightboxZoom() {
      lbScale = 1;
      lbPanX = 0;
      lbPanY = 0;
      updateLightboxTransform();
    }

    function zoomLightbox(factor) {
      lbScale = Math.max(1, Math.min(6, lbScale * factor));
      if (lbScale === 1) {
        lbPanX = 0;
        lbPanY = 0;
      }
      updateLightboxTransform();
    }

    lightboxStage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.15;
      if (e.deltaY < 0) {
        zoomLightbox(zoomFactor);
      } else {
        zoomLightbox(1 / zoomFactor);
      }
    }, { passive: false });

    lightboxStage.addEventListener('mousedown', (e) => {
      if (lbScale <= 1 || e.target.closest('button')) return;
      lbIsDragging = true;
      lbStartX = e.clientX - lbPanX;
      lbStartY = e.clientY - lbPanY;
      updateLightboxTransform();
    });

    window.addEventListener('mousemove', (e) => {
      if (!lbIsDragging) return;
      lbPanX = e.clientX - lbStartX;
      lbPanY = e.clientY - lbStartY;
      updateLightboxTransform();
    });

    window.addEventListener('mouseup', () => {
      if (lbIsDragging) {
        lbIsDragging = false;
        updateLightboxTransform();
      }
    });

    function openLightbox(index) {
      currentPhotoIdx = index;
      resetLightboxZoom();
      updateLightbox();
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      resetLightboxZoom();
    }

    function updateLightbox() {
      if (!currentStationPhotoURLs.length) return;
      resetLightboxZoom();
      lightboxImg.src = currentStationPhotoURLs[currentPhotoIdx];
      lightboxCounter.textContent = `${currentPhotoIdx + 1} / ${currentStationPhotoURLs.length}`;
    }

    function nextPhoto() {
      if (!currentStationPhotoURLs.length) return;
      currentPhotoIdx = (currentPhotoIdx + 1) % currentStationPhotoURLs.length;
      updateLightbox();
    }

    function prevPhoto() {
      if (!currentStationPhotoURLs.length) return;
      currentPhotoIdx = (currentPhotoIdx - 1 + currentStationPhotoURLs.length) % currentStationPhotoURLs.length;
      updateLightbox();
    }

    window.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowRight') nextPhoto();
      if (e.key === 'ArrowLeft') prevPhoto();
      if (e.key === 'Escape') closeLightbox();
      if (e.key === '+' || e.key === '=') zoomLightbox(1.25);
      if (e.key === '-' || e.key === '_') zoomLightbox(0.8);
      if (e.key === '0') resetLightboxZoom();
    });

    // Initialize Map and Pins
    function initMap() {
      renderPins();
      resetZoom();
    }

    if (mapImg.complete) {
      initMap();
    } else {
      mapImg.onload = initMap;
    }

    window.addEventListener('resize', resetZoom);
  </script>
</body>
