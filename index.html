<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>London Tube Photo Map</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #dc2626;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .view {
      display: none;
      width: 100vw;
      height: 100vh;
    }
    .view.active {
      display: flex;
    }

    /* Toolbar */
    .toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 100;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toolbar h1 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-right: 8px;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button.secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: #e2e8f0;
    }

    /* Map Viewport */
    #map-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #eceff1;
      user-select: none;
    }

    #map-viewport:active {
      cursor: grabbing;
    }

    #map-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #map-img {
      display: block;
      max-width: none;
      pointer-events: none;
    }

    /* Station Pins */
    .station-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 6px;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, background 0.15s;
    }

    .station-pin:hover .pin-dot {
      transform: scale(1.4);
      background: #b91c1c;
    }

    /* Gallery View */
    #gallery-view {
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
      padding: 30px;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .gallery-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      transition: transform 0.2s;
    }

    .gallery-card:hover {
      transform: translateY(-3px);
    }

    .gallery-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      background: #f1f5f9;
    }

    /* Lightbox Modal */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .lightbox-img {
      max-width: 85vw;
      max-height: 85vh;
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      object-fit: contain;
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      user-select: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      line-height: 1;
      padding: 0;
      transition: background 0.2s, transform 0.15s;
      z-index: 1010;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-50%) scale(1.08);
    }

    .prev-btn { left: 24px; }
    .next-btn { right: 24px; }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: transparent;
      color: white;
      font-size: 2.5rem;
      border: none;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1010;
    }

    .lightbox-zoom-toolbar {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 8px;
      z-index: 1010;
    }

    .zoom-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .zoom-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 24px;
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      z-index: 1010;
    }

    .empty-state-box {
      grid-column: 1 / -1;
      background: #ffffff;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- MAP VIEW -->
  <div id="map-view" class="view active">
    <div class="toolbar">
      <h1>London Tube Photo Log</h1>
      <button class="secondary" onclick="resetZoom()">Reset View</button>
    </div>

    <div id="map-viewport">
      <div id="map-container">
        <img id="map-img" src="tube-map.jpg" alt="London Tube Map">
        <div id="pins-layer"></div>
      </div>
    </div>
  </div>

  <!-- GALLERY VIEW -->
  <div id="gallery-view" class="view">
    <div class="gallery-header">
      <div>
        <button class="secondary" onclick="showMapView()">← Back to Map</button>
        <h1 id="gallery-title" style="margin-top: 10px; font-size: 1.8rem;">Station Photos</h1>
      </div>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <!-- FULLSCREEN LIGHTBOX -->
  <div id="lightbox">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <button class="nav-btn prev-btn" onclick="prevPhoto()" aria-label="Previous Photo">&#10094;</button>
    
    <div id="lightbox-stage">
      <img id="lightbox-img" class="lightbox-img" src="" alt="Full view">
    </div>

    <div class="lightbox-zoom-toolbar">
      <button class="zoom-btn" onclick="zoomLightbox(1.25)">Zoom +</button>
      <button class="zoom-btn" onclick="zoomLightbox(0.8)">Zoom -</button>
      <button class="zoom-btn" onclick="resetLightboxZoom()">Reset</button>
    </div>

    <button class="nav-btn next-btn" onclick="nextPhoto()" aria-label="Next Photo">&#10095;</button>
    <div id="lightbox-counter" class="lightbox-counter"></div>
  </div>

  <script>
    let stations = [];
    let currentStation = null;
    let currentPhotoIdx = 0;
    let currentStationPhotoURLs = [];

    // Load station configuration automatically on startup
    async function loadStationsData() {
      try {
        const res = await fetch('tube_stations.json');
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        stations = await res.json();
        renderPins();
      } catch (err) {
        console.error('Could not load tube_stations.json:', err);
      }
    }

    // --- Pan & Zoom Engine for Map ---
    const viewport = document.getElementById('map-viewport');
    const container = document.getElementById('map-container');
    const mapImg = document.getElementById('map-img');
    const pinsLayer = document.getElementById('pins-layer');

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startX, startY;

    function updateTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function resetZoom() {
      const vpWidth = viewport.clientWidth;
      const vpHeight = viewport.clientHeight;
      const imgWidth = mapImg.naturalWidth || 4961;
      const imgHeight = mapImg.naturalHeight || 3782;

      scale = Math.min(vpWidth / imgWidth, vpHeight / imgHeight);
      panX = (vpWidth - imgWidth * scale) / 2;
      panY = (vpHeight - imgHeight * scale) / 2;

      updateTransform();
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.15;
      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const prevScale = scale;
      if (e.deltaY < 0) {
        scale = Math.min(scale * zoomFactor, 8);
      } else {
        scale = Math.max(scale / zoomFactor, 0.05);
      }

      panX = mouseX - (mouseX - panX) * (scale / prevScale);
      panY = mouseY - (mouseY - panY) * (scale / prevScale);
      updateTransform();
    }, { passive: false });

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.station-pin') || e.target.closest('.toolbar')) return;
      isPanning = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    // --- Station Pins ---
    function renderPins() {
      pinsLayer.innerHTML = '';
      stations.forEach(station => {
        const pin = document.createElement('div');
        pin.className = 'station-pin';
        pin.style.left = `${station.x}%`;
        pin.style.top = `${station.y}%`;
        pin.title = station.name;

        pin.innerHTML = `<div class="pin-dot"></div>`;
        pin.onclick = (e) => {
          e.stopPropagation();
          openGallery(station);
        };
        pinsLayer.appendChild(pin);
      });
    }

    // --- Gallery Engine ---
    function showMapView() {
      document.getElementById('gallery-view').classList.remove('active');
      document.getElementById('map-view').classList.add('active');
    }

    function openGallery(station) {
      currentStation = station;
      document.getElementById('map-view').classList.remove('active');
      document.getElementById('gallery-view').classList.add('active');
      document.getElementById('gallery-title').textContent = station.name;
      renderGalleryCards();
    }

    function renderGalleryCards() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';
      currentStationPhotoURLs = [];

      // Find all photos across any entry sharing this station name
      const matchingEntries = stations.filter(s => s.name.trim().toLowerCase() === currentStation.name.trim().toLowerCase());
      const allStationPhotos = Array.from(new Set(matchingEntries.flatMap(s => s.photos || [])));

      if (allStationPhotos.length === 0) {
        grid.innerHTML = `
          <div class="empty-state-box">
            <h3>No Photos Available</h3>
            <p style="margin-top: 8px;">No photos found for <b>${currentStation.name}</b>.</p>
          </div>
        `;
        return;
      }

      allStationPhotos.forEach((photoFile, idx) => {
        // Direct relative path served by GitHub Pages
        const src = `photos/${encodeURIComponent(currentStation.name)}/${encodeURIComponent(photoFile)}`;
        currentStationPhotoURLs.push(src);

        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.innerHTML = `
          <img src="${src}" alt="${currentStation.name}" onclick="openLightbox(${idx})" onerror="this.onerror=null; this.src='https://placehold.co/600x400/f1f5f9/94a3b8?text=Image+Not+Found'">
        `;
        grid.appendChild(card);
      });
    }

    // --- Fullscreen Lightbox & Photo Zoom Engine ---
    const lightbox = document.getElementById('lightbox');
    const lightboxStage = document.getElementById('lightbox-stage');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCounter = document.getElementById('lightbox-counter');

    let lbScale = 1;
    let lbPanX = 0;
    let lbPanY = 0;
    let lbIsDragging = false;
    let lbStartX, lbStartY;

    function updateLightboxTransform() {
      lightboxImg.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbScale})`;
      lightboxStage.style.cursor = lbScale > 1 ? (lbIsDragging ? 'grabbing' : 'grab') : 'default';
    }

    function resetLightboxZoom() {
      lbScale = 1;
      lbPanX = 0;
      lbPanY = 0;
      updateLightboxTransform();
    }

    function zoomLightbox(factor) {
      lbScale = Math.max(1, Math.min(6, lbScale * factor));
      if (lbScale === 1) {
        lbPanX = 0;
        lbPanY = 0;
      }
      updateLightboxTransform();
    }

    lightboxStage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.15;
      if (e.deltaY < 0) {
        zoomLightbox(zoomFactor);
      } else {
        zoomLightbox(1 / zoomFactor);
      }
    }, { passive: false });

    lightboxStage.addEventListener('mousedown', (e) => {
      if (lbScale <= 1 || e.target.closest('button')) return;
      lbIsDragging = true;
      lbStartX = e.clientX - lbPanX;
      lbStartY = e.clientY - lbPanY;
      updateLightboxTransform();
    });

    window.addEventListener('mousemove', (e) => {
      if (!lbIsDragging) return;
      lbPanX = e.clientX - lbStartX;
      lbPanY = e.clientY - lbStartY;
      updateLightboxTransform();
    });

    window.addEventListener('mouseup', () => {
      if (lbIsDragging) {
        lbIsDragging = false;
        updateLightboxTransform();
      }
    });

    function openLightbox(index) {
      currentPhotoIdx = index;
      resetLightboxZoom();
      updateLightbox();
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      resetLightboxZoom();
    }

    function updateLightbox() {
      if (!currentStationPhotoURLs.length) return;
      resetLightboxZoom();
      lightboxImg.src = currentStationPhotoURLs[currentPhotoIdx];
      lightboxCounter.textContent = `${currentPhotoIdx + 1} / ${currentStationPhotoURLs.length}`;
    }

    function nextPhoto() {
      if (!currentStationPhotoURLs.length) return;
      currentPhotoIdx = (currentPhotoIdx + 1) % currentStationPhotoURLs.length;
      updateLightbox();
    }

    function prevPhoto() {
      if (!currentStationPhotoURLs.length) return;
      currentPhotoIdx = (currentPhotoIdx - 1 + currentStationPhotoURLs.length) % currentStationPhotoURLs.length;
      updateLightbox();
    }

    window.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowRight') nextPhoto();
      if (e.key === 'ArrowLeft') prevPhoto();
      if (e.key === 'Escape') closeLightbox();
      if (e.key === '+' || e.key === '=') zoomLightbox(1.25);
      if (e.key === '-' || e.key === '_') zoomLightbox(0.8);
      if (e.key === '0') resetLightboxZoom();
    });

    // Initialize Map and Data
    function initMap() {
      resetZoom();
      loadStationsData();
    }

    if (mapImg.complete) {
      initMap();
    } else {
      mapImg.onload = initMap;
    }

    window.addEventListener('resize', resetZoom);
  </script>
</body>
</html>
