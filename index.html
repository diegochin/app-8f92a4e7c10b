<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>London Tube Photo Map</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #dc2626;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: var(--bg);
      color: var(--text);
    }

    .view {
      display: none;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    .view.active {
      display: flex;
    }

    /* Map Toolbar */
    .toolbar {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
      backdrop-filter: blur(8px);
      max-width: calc(100vw - 24px);
    }

    .toolbar h1 {
      font-size: 0.88rem;
      font-weight: 700;
      margin-right: 4px;
      white-space: nowrap;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button.secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: #e2e8f0;
    }

    button.danger {
      background: #ef4444;
      color: white;
    }

    button.danger:hover {
      background: #dc2626;
    }

    /* Map Viewport */
    #map-viewport {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      background: #eceff1;
      user-select: none;
      touch-action: none;
    }

    #map-container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #map-img {
      display: block;
      max-width: none;
      pointer-events: none;
    }

    /* Station Pins */
    .station-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 10px;
      touch-action: none;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease;
    }

    .station-pin:hover .pin-dot {
      transform: scale(1.35);
      background: #b91c1c;
    }

    /* Gallery View */
    #gallery-view {
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px 40px;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      gap: 12px;
    }

    .gallery-header h1 {
      font-size: 1.4rem;
      margin-top: 6px;
    }

    .gallery-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .gallery-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
    }

    .gallery-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      background: #f1f5f9;
    }

    /* Floating delete button */
    .delete-photo-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.75);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      transition: opacity 0.2s ease, background 0.2s ease;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
    }

    .gallery-card:hover .delete-photo-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .delete-photo-btn:hover {
      background: #dc2626;
    }

    /* Fullscreen Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      object-fit: contain;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.25);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      line-height: 1;
      padding: 0;
      z-index: 1010;
    }

    .prev-btn { left: 16px; }
    .next-btn { right: 16px; }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1.8rem;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1010;
    }

    .lightbox-zoom-toolbar {
      position: absolute;
      bottom: 20px;
      left: 16px;
      display: flex;
      gap: 6px;
      z-index: 1010;
    }

    .zoom-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .lightbox-counter {
      position: absolute;
      bottom: 20px;
      color: white;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 1010;
    }

    .empty-state-box {
      grid-column: 1 / -1;
      background: #ffffff;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    /* Mobile Adaptations */
    @media (max-width: 640px) {
      .toolbar {
        padding: 6px 8px;
        gap: 4px;
      }
      .toolbar h1 {
        display: none;
      }
      .toolbar button {
        padding: 5px 8px;
        font-size: 0.74rem;
      }
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .gallery-card img {
        height: 150px;
      }
      .delete-photo-btn {
        opacity: 1;
        pointer-events: auto;
        width: 28px;
        height: 28px;
        font-size: 0.95rem;
      }
      .nav-btn {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
      }
      .prev-btn { left: 8px; }
      .next-btn { right: 8px; }
      .close-btn {
        top: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- MAP VIEW -->
  <div id="map-view" class="view active">
    <div class="toolbar">
      <h1>Tube Map Tour</h1>
      <button class="secondary" onclick="resetZoom()">Reset Map</button>
      <button class="secondary" onclick="addNewStation()">Add Station</button>
      <button class="secondary" onclick="exportData()">Export JSON</button>
    </div>

    <div id="map-viewport">
      <div id="map-container">
        <img id="map-img" src="tube-map.jpg" alt="London Tube Map">
        <div id="pins-layer"></div>
      </div>
    </div>
  </div>

  <!-- GALLERY VIEW -->
  <div id="gallery-view" class="view">
    <div class="gallery-header">
      <div>
        <button class="secondary" onclick="showMapView()">← Back to Map</button>
        <h1 id="gallery-title">Station Photos</h1>
      </div>
      <div class="gallery-actions">
        <input type="file" id="file-input" multiple accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
        <button onclick="document.getElementById('file-input').click()">+ Photos</button>
        <button class="danger" onclick="deleteCurrentPin()">Delete Marker</button>
      </div>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <!-- FULLSCREEN LIGHTBOX -->
  <div id="lightbox">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <button class="nav-btn prev-btn" onclick="prevPhoto()" aria-label="Previous Photo">&#10094;</button>
    
    <div id="lightbox-stage">
      <img id="lightbox-img" class="lightbox-img" src="" alt="Full view">
    </div>

    <div class="lightbox-zoom-toolbar">
      <button class="zoom-btn" onclick="zoomLightbox(1.3)">Zoom +</button>
      <button class="zoom-btn" onclick="zoomLightbox(0.75)">Zoom -</button>
      <button class="zoom-btn" onclick="resetLightboxZoom()">Reset</button>
    </div>

    <button class="nav-btn next-btn" onclick="nextPhoto()" aria-label="Next Photo">&#10095;</button>
    <div id="lightbox-counter" class="lightbox-counter"></div>
  </div>

  <script>
    const DB_NAME = 'TubeMapTourDB';
    const DB_VERSION = 2;
    const STORE_NAME = 'station_photos_v2';

    function getStationKey(name) {
      return (name || '').trim().toLowerCase();
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbSavePhoto(stationName, fileName, blob) {
      const db = await openDB();
      const stationKey = getStationKey(stationName);
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put({ id: `${stationKey}___${fileName}`, stationKey, fileName, blob });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetPhoto(stationName, fileName) {
      const db = await openDB();
      const stationKey = getStationKey(stationName);
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(`${stationKey}___${fileName}`);
        req.onsuccess = () => resolve(req.result ? req.result.blob : null);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbDeletePhoto(stationName, fileName) {
      const db = await openDB();
      const stationKey = getStationKey(stationName);
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(`${stationKey}___${fileName}`);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbDeleteStationPhotos(stationName) {
      const db = await openDB();
      const stationKey = getStationKey(stationName);
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.openCursor();
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            if (cursor.value.stationKey === stationKey) cursor.delete();
            cursor.continue();
          } else {
            resolve();
          }
        };
        req.onerror = () => reject(req.error);
      });
    }

    let stations = JSON.parse(localStorage.getItem('tube_stations_v4')) || [];
    let currentStation = null;
    let currentPhotoIdx = 0;
    let currentStationPhotoURLs = [];

    function saveStations() {
      localStorage.setItem('tube_stations_v4', JSON.stringify(stations));
    }

    async function loadDefaultStationsIfEmpty() {
      try {
        const response = await fetch('tube_stations.json');
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data) && data.length > 0 && stations.length === 0) {
            stations = data;
            saveStations();
          }
        }
      } catch (e) {
        console.log("No default tube_stations.json found.");
      }
    }

    function syncPhotosForStationName(name, photosList) {
      const key = getStationKey(name);
      stations.forEach(st => {
        if (getStationKey(st.name) === key) st.photos = [...photosList];
      });
      saveStations();
    }

    function buildServerPhotoURL(stationName, fileName) {
      return `photos/${encodeURIComponent(stationName.trim())}/${encodeURIComponent(fileName.trim())}`;
    }

    // --- Map Pan & Zoom Engine (Mouse + Touch) ---
    const viewport = document.getElementById('map-viewport');
    const container = document.getElementById('map-container');
    const mapImg = document.getElementById('map-img');
    const pinsLayer = document.getElementById('pins-layer');

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startX, startY;
    let initialPinchDistance = null;
    let initialScale = 1;

    function updateTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function resetZoom() {
      const vpWidth = viewport.clientWidth;
      const vpHeight = viewport.clientHeight;
      const imgWidth = mapImg.naturalWidth || 4961;
      const imgHeight = mapImg.naturalHeight || 3782;

      scale = Math.min(vpWidth / imgWidth, vpHeight / imgHeight);
      panX = (vpWidth - imgWidth * scale) / 2;
      panY = (vpHeight - imgHeight * scale) / 2;

      updateTransform();
    }

    // Desktop Mouse Wheel Zoom
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.18;
      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const prevScale = scale;
      if (e.deltaY < 0) {
        scale = Math.min(scale * zoomFactor, 15);
      } else {
        scale = Math.max(scale / zoomFactor, 0.04);
      }

      panX = mouseX - (mouseX - panX) * (scale / prevScale);
      panY = mouseY - (mouseY - panY) * (scale / prevScale);
      updateTransform();
    }, { passive: false });

    // Desktop Mouse Pan
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.station-pin') || e.target.closest('.toolbar')) return;
      isPanning = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    // Touch Support for Mobile (1-finger pan, 2-finger pinch-to-zoom)
    viewport.addEventListener('touchstart', (e) => {
      if (e.target.closest('.station-pin') || e.target.closest('.toolbar')) return;
      if (e.touches.length === 1) {
        isPanning = true;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
      } else if (e.touches.length === 2) {
        isPanning = false;
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isPanning) {
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const rect = viewport.getBoundingClientRect();
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;

        const prevScale = scale;
        scale = Math.min(15, Math.max(0.04, initialScale * (currentDistance / initialPinchDistance)));

        panX = midX - (midX - panX) * (scale / prevScale);
        panY = midY - (midY - panY) * (scale / prevScale);
        updateTransform();
      }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isPanning = false;
        initialPinchDistance = null;
      }
    });

    // --- Station Pins & Dragging ---
    function renderPins() {
      pinsLayer.innerHTML = '';
      stations.forEach(station => {
        const pin = document.createElement('div');
        pin.className = 'station-pin';
        pin.style.left = `${station.x}%`;
        pin.style.top = `${station.y}%`;
        pin.dataset.id = station.id;
        pin.title = station.name;

        pin.innerHTML = `<div class="pin-dot"></div>`;
        setupPinInteractions(pin, station);
        pinsLayer.appendChild(pin);
      });
    }

    function setupPinInteractions(pinElement, station) {
      let isDragging = false;
      let hasMoved = false;
      let startMouseX, startMouseY;

      const handleStart = (clientX, clientY) => {
        isDragging = true;
        hasMoved = false;
        startMouseX = clientX;
        startMouseY = clientY;
      };

      const handleMove = (clientX, clientY) => {
        if (!isDragging) return;
        const dx = Math.abs(clientX - startMouseX);
        const dy = Math.abs(clientY - startMouseY);

        if (dx > 5 || dy > 5) {
          hasMoved = true;
          const imgRect = mapImg.getBoundingClientRect();
          const percentX = ((clientX - imgRect.left) / imgRect.width) * 100;
          const percentY = ((clientY - imgRect.top) / imgRect.height) * 100;

          station.x = Math.max(0, Math.min(100, percentX));
          station.y = Math.max(0, Math.min(100, percentY));

          pinElement.style.left = `${station.x}%`;
          pinElement.style.top = `${station.y}%`;
        }
      };

      const handleEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        if (hasMoved) {
          saveStations();
        } else {
          openGallery(station);
        }
      };

      pinElement.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        handleStart(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', handleEnd);

      pinElement.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        handleStart(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length > 0) {
          handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      });
      window.addEventListener('touchend', handleEnd);
    }

    function addNewStation() {
      const rawName = prompt("Enter Station Name (e.g. Hammersmith):");
      if (!rawName || !rawName.trim()) return;

      const name = rawName.trim();
      const existingMatch = stations.find(s => getStationKey(s.name) === getStationKey(name));
      const sharedPhotos = existingMatch ? [...existingMatch.photos] : [];

      const viewportRect = viewport.getBoundingClientRect();
      const imgRect = mapImg.getBoundingClientRect();
      
      const centerX = (viewportRect.width / 2 - imgRect.left) / imgRect.width * 100;
      const centerY = (viewportRect.height / 2 - imgRect.top) / imgRect.height * 100;

      const newStation = {
        id: 'stn_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        name: name,
        x: Math.max(5, Math.min(95, centerX)),
        y: Math.max(5, Math.min(95, centerY)),
        photos: sharedPhotos
      };

      stations.push(newStation);
      saveStations();
      renderPins();
    }

    function deleteCurrentPin() {
      if (!currentStation) return;
      const sameNameCount = stations.filter(s => getStationKey(s.name) === getStationKey(currentStation.name)).length;
      
      if (sameNameCount > 1) {
        if (confirm(`Delete only this marker for "${currentStation.name}"?`)) {
          stations = stations.filter(s => s.id !== currentStation.id);
          saveStations();
          renderPins();
          showMapView();
        }
      } else {
        if (confirm(`Delete "${currentStation.name}" marker and its photos?`)) {
          dbDeleteStationPhotos(currentStation.name);
          stations = stations.filter(s => s.id !== currentStation.id);
          saveStations();
          renderPins();
          showMapView();
        }
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stations, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "tube_stations.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // --- Gallery & Lightbox ---
    function showMapView() {
      document.getElementById('gallery-view').classList.remove('active');
      document.getElementById('map-view').classList.add('active');
      updateTransform();
    }

    async function openGallery(station) {
      currentStation = station;
      document.getElementById('map-view').classList.remove('active');
      document.getElementById('gallery-view').classList.add('active');
      document.getElementById('gallery-title').textContent = station.name;
      await renderGalleryCards();
    }

    async function renderGalleryCards() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';
      currentStationPhotoURLs = [];

      if (!currentStation.photos || currentStation.photos.length === 0) {
        grid.innerHTML = `
          <div class="empty-state-box">
            <h3>No Photos Added Yet</h3>
            <p style="margin-top: 8px;">Click <b>"+ Photos"</b> above or ensure images exist under <code>photos/${currentStation.name}/</code></p>
          </div>
        `;
        return;
      }

      for (let idx = 0; idx < currentStation.photos.length; idx++) {
        const photoFile = currentStation.photos[idx];
        const blob = await dbGetPhoto(currentStation.name, photoFile);
        let src = blob ? URL.createObjectURL(blob) : buildServerPhotoURL(currentStation.name, photoFile);

        currentStationPhotoURLs.push(src);

        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.innerHTML = `
          <button class="delete-photo-btn" onclick="event.stopPropagation(); removeSinglePhoto('${photoFile}')" title="Delete Photo">&times;</button>
          <img src="${src}" alt="${currentStation.name}" 
               onclick="openLightbox(${idx})" 
               onerror="handleImageError(this, '${encodeURIComponent(currentStation.name)}', '${encodeURIComponent(photoFile)}')">
        `;
        grid.appendChild(card);
      }
    }

    function handleImageError(imgElem, stationEnc, fileEnc) {
      const originalSrc = imgElem.src;
      if (!imgElem.dataset.retried) {
        imgElem.dataset.retried = '1';
        if (originalSrc.endsWith('.jpg')) {
          imgElem.src = originalSrc.replace(/\.jpg$/i, '.JPG');
          return;
        } else if (originalSrc.endsWith('.JPG')) {
          imgElem.src = originalSrc.replace(/\.JPG$/i, '.jpg');
          return;
        }
      }
      imgElem.src = 'https://placehold.co/600x400/f1f5f9/94a3b8?text=Image+Not+Found';
    }

    async function handleFileUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length || !currentStation) return;

      for (const file of files) {
        await dbSavePhoto(currentStation.name, file.name, file);
        if (!currentStation.photos.includes(file.name)) {
          currentStation.photos.push(file.name);
        }
      }

      syncPhotosForStationName(currentStation.name, currentStation.photos);
      await renderGalleryCards();
      event.target.value = '';
    }

    async function removeSinglePhoto(fileName) {
      if (!currentStation) return;
      await dbDeletePhoto(currentStation.name, fileName);
      currentStation.photos = currentStation.photos.filter(f => f !== fileName);
      syncPhotosForStationName(currentStation.name, currentStation.photos);
      await renderGalleryCards();
    }

    // --- Lightbox with Pinch-to-Zoom & Pan ---
    const lightbox = document.getElementById('lightbox');
    const lightboxStage = document.getElementById('lightbox-stage');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCounter = document.getElementById('lightbox-counter');

    let lbScale = 1;
    let lbPanX = 0;
    let lbPanY = 0;
    let lbIsDragging = false;
    let lbStartX, lbStartY;
    let lbPinchDist = null;
    let lbStartScale = 1;

    function updateLightboxTransform() {
      lightboxImg.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbScale})`;
      lightboxStage.style.cursor = lbScale > 1 ? (lbIsDragging ? 'grabbing' : 'grab') : 'default';
    }

    function resetLightboxZoom() {
      lbScale = 1;
      lbPanX = 0;
      lbPanY = 0;
      updateLightboxTransform();
    }

    function zoomLightbox(factor) {
      lbScale = Math.max(1, Math.min(8, lbScale * factor));
      if (lbScale === 1) {
        lbPanX = 0;
        lbPanY = 0;
      }
      updateLightboxTransform();
    }

    lightboxStage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.15;
      if (e.deltaY < 0) zoomLightbox(zoomFactor);
      else zoomLightbox(1 / zoomFactor);
    }, { passive: false });

    lightboxStage.addEventListener('mousedown', (e) => {
      if (lbScale <= 1 || e.target.closest('button')) return;
      lbIsDragging = true;
      lbStartX = e.clientX - lbPanX;
      lbStartY = e.clientY - lbPanY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!lbIsDragging) return;
      lbPanX = e.clientX - lbStartX;
      lbPanY = e.clientY - lbStartY;
      updateLightboxTransform();
    });

    window.addEventListener('mouseup', () => { lbIsDragging = false; });

    // Touch Zoom & Pan on Lightbox
    lightboxStage.addEventListener('touchstart', (e) => {
      if (e.target.closest('button')) return;
      if (e.touches.length === 1 && lbScale > 1) {
        lbIsDragging = true;
        lbStartX = e.touches[0].clientX - lbPanX;
        lbStartY = e.touches[0].clientY - lbPanY;
      } else if (e.touches.length === 2) {
        lbIsDragging = false;
        lbPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        lbStartScale = lbScale;
      }
    }, { passive: false });

    lightboxStage.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && lbIsDragging) {
        lbPanX = e.touches[0].clientX - lbStartX;
        lbPanY = e.touches[0].clientY - lbStartY;
        updateLightboxTransform();
      } else if (e.touches.length === 2 && lbPinchDist) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        lbScale = Math.max(1, Math.min(8, lbStartScale * (dist / lbPinchDist)));
        if (lbScale === 1) {
          lbPanX = 0;
          lbPanY = 0;
        }
        updateLightboxTransform();
      }
    }, { passive: false });

    lightboxStage.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        lbIsDragging = false;
        lbPinchDist = null;
      }
    });

    function openLightbox(index) {
      currentPhotoIdx = index;
      resetLightboxZoom();
      updateLightbox();
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      resetLightboxZoom();
    }

    function updateLightbox() {
      if (!currentStationPhotoURLs.length) return;
      resetLightboxZoom();
      lightboxImg.src = currentStationPhotoURLs[currentPhotoIdx];
      lightboxCounter.textContent = `${currentPhotoIdx + 1} / ${currentStationPhotoURLs.length}`;
    }

    function nextPhoto() {
      if (!currentStationPhotoURLs.length) return;
      currentPhotoIdx = (currentPhotoIdx + 1) % currentStationPhotoURLs.length;
      updateLightbox();
    }

    function prevPhoto() {
      if (!currentStationPhotoURLs.length) return;
      currentPhotoIdx = (currentPhotoIdx - 1 + currentStationPhotoURLs.length) % currentStationPhotoURLs.length;
      updateLightbox();
    }

    window.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowRight') nextPhoto();
      if (e.key === 'ArrowLeft') prevPhoto();
      if (e.key === 'Escape') closeLightbox();
    });

    async function initMap() {
      await loadDefaultStationsIfEmpty();
      renderPins();
      resetZoom();
    }

    if (mapImg.complete) {
      initMap();
    } else {
      mapImg.onload = initMap;
    }

    window.addEventListener('resize', () => {
      if (document.getElementById('map-view').classList.contains('active')) {
        updateTransform();
      }
    });
  </script>
</body>
</html>
